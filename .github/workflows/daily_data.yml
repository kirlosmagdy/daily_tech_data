name: Daily Tech Data Pipeline

on:
  schedule:
    # 08:00 UTC = 10:00 AM Cairo time (EET, UTC+2)
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v

      - name: Run full data pipeline (Extract, Normalize, Enrich, dbt, Export)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAILY_DEV_TOKEN: ${{ secrets.DAILY_DEV_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.run

      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          CLEAN_HOOK_URL=$(echo "$VERCEL_DEPLOY_HOOK_URL" | tr -d '[:space:]')
          if [ -n "$CLEAN_HOOK_URL" ]; then
            curl -fsS -X POST "$CLEAN_HOOK_URL" > /dev/null || echo "Deploy hook warning (non-fatal)"
          fi

      - name: Send Telegram failure alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python -c "import os; from pipeline.notify import send_failure_alert; send_failure_alert(os.getenv('RUN_URL', ''))"